# Free preview. Upgrade both resources before relying on this for students:
# free PostgreSQL expires after 30 days; free web services sleep when idle.
services:
  - type: web
    name: mindmitra
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindmitra-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PDF_OCR_LANGUAGES
        value: eng+hin

databases:
  - name: mindmitra-db
    databaseName: mindmitra
    user: mindmitra
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []
